{% assign number_index = include.index | minus: 1 %}<article class="writing-item"><span class="item-number">{{ site.geez_numbers[number_index] }}</span><div class="writing-item-main"><h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2><p>{{ include.post.excerpt | strip_html | default: "A developing essay from the notebook." | truncatewords: 32 }}</p></div><time class="writing-date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %Y" }}</time></article>
